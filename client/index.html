<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalPay | Secure Global UPI</title>
  <!-- Browser Tab Favicon -->
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090d16">
</head>
<body class="gp-app-body">

  <!-- Systematic Top Header -->
  <header class="gp-header">
    <div class="gp-brand">
      <img src="/assets/logo.png" alt="GlobalPay Logo" style="width: 32px; height: 32px; object-fit: contain; border-radius: 8px;">
      <span class="gp-logo-text" style="font-weight: 800; letter-spacing: -0.5px;">GlobalPay</span>
    </div>
    <div class="gp-wallet-pill">
      <span style="font-size:10px; color:#94a3b8; display:block;">Balance</span>
      <span id="gp-header-balance" style="font-weight:700; color:#10b981;">₹45,850</span>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="gp-content">
    <div class="gp-dashboard">
      
      <!-- Left Column: Google-Style Search & Quick Actions -->
      <div>
        <!-- Universal Search Bar -->
        <div class="gp-google-search-box" onclick="gpOpenPay()">
          <span style="font-size: 18px;">🔍</span>
          <input type="text" placeholder="Search name, UPI ID, phone, or merchant..." readonly style="background:transparent; border:none; color:#f8fafc; width:100%; outline:none; font-size:14px; cursor:pointer;">
          <span style="font-size: 16px; color: #3b82f6;">🎙️</span>
        </div>

        <div class="gp-hero-card" style="margin-top: 16px;">
          <div style="font-size:13px; color:#94a3b8;">Total Portfolio Value</div>
          <div style="font-size:28px; font-weight:800; margin:4px 0 12px 0;">₹45,850.00 <span style="font-size:14px; color:#10b981;">+2.4%</span></div>
          
          <div class="gp-quick-actions">
            <button class="gp-action-btn" onclick="gpOpenScan()">📷<br>Scan QR</button>
            <button class="gp-action-btn" onclick="gpOpenPay()">💸<br>Pay UPI</button>
            <button class="gp-action-btn" onclick="gpOpenMyQr()">🔳<br>My QR</button>
            <button class="gp-action-btn" onclick="gpOpenBills()">⚡<br>Bills</button>
          </div>
        </div>

        <div class="gp-section-title">People & Global Corridors</div>
        <div class="gp-people-row">
          <div class="gp-person" onclick="gpOpenPay()">
            <div class="gp-avatar"><img src="https://flagcdn.com/w40/in.png" alt="India" style="width:28px; border-radius:4px;"></div>
            <span>Rahul</span>
          </div>
          <div class="gp-person" onclick="gpOpenPay()">
            <div class="gp-avatar"><img src="https://flagcdn.com/w40/ae.png" alt="UAE" style="width:28px; border-radius:4px;"></div>
            <span>Zayed</span>
          </div>
          <div class="gp-person" onclick="gpOpenPay()">
            <div class="gp-avatar"><img src="https://flagcdn.com/w40/fr.png" alt="France" style="width:28px; border-radius:4px;"></div>
            <span>Claire</span>
          </div>
          <div class="gp-person" onclick="gpOpenPay()">
            <div class="gp-avatar"><img src="https://flagcdn.com/w40/np.png" alt="Nepal" style="width:28px; border-radius:4px;"></div>
            <span>Bikash</span>
          </div>
          <div class="gp-person" onclick="gpOpenPay()">
            <div class="gp-avatar"><img src="https://flagcdn.com/w40/sg.png" alt="Singapore" style="width:28px; border-radius:4px;"></div>
            <span>Wei</span>
          </div>
        </div>
      </div>

      <!-- Right Column: Quick Bills Feed -->
      <div>
        <div class="gp-section-title">Quick Pay & Services</div>
        <div style="background:#131c2e; border:1px solid #1e293b; border-radius:20px; padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:13px; font-weight:600;">
            <span>Popular Billers</span>
            <span style="color:#3b82f6; cursor:pointer;" onclick="gpOpenBills()">View All</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; background:#090d16; padding:10px 14px; border-radius:12px; cursor:pointer;" onclick="gpOpenBills()">
              <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:18px;">📱</span>
                <div><div style="font-size:13px; font-weight:600;">Jio Prepaid Recharge</div><div style="font-size:11px; color:#94a3b8;">+91 98765 43210</div></div>
              </div>
              <span style="font-size:13px; font-weight:600; color:#10b981;">₹299</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; background:#090d16; padding:10px 14px; border-radius:12px; cursor:pointer;" onclick="gpOpenBills()">
              <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:18px;">💡</span>
                <div><div style="font-size:13px; font-weight:600;">Electricity Board</div><div style="font-size:11px; color:#94a3b8;">Consumer #4092</div></div>
              </div>
              <span style="font-size:13px; font-weight:600; color:#10b981;">₹1,450</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Systematic Bottom Navigation Bar -->
  <nav class="gp-bottom-nav">
    <a href="#" class="gp-nav-item active">🏠<span>Home</span></a>
    <a href="#" class="gp-nav-item" onclick="gpOpenScan(); return false;">📷<span>Scan</span></a>
    <a href="#" class="gp-nav-item" onclick="gpOpenBills(); return false;">⚡<span>Bills</span></a>
    <a href="#" class="gp-nav-item" onclick="gpOpenMyQr(); return false;">🔳<span>Receive</span></a>
  </nav>

  <!-- Required Scripts -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="/js/gpay-features.js"></script>
</body>
</html>
